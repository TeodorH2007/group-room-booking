<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Book Room</title>
</head>
<body>
    <header>
        <h1>Book Room</h1>
        <nav>
                <a href="index.html">Home</a>
                <a href="rooms.html">Rooms</a>
                <a href="book.html">Book Room</a>
                <a href="bookings.html">Bookings</a>
                <a href="contact.html">Contact</a>
        </nav>
    </header>
<main>
        <form class="booking-form"> 
            <label for="room">Select Room:</label>
            <select id="room" name="room">
                <option value="" disabled selected>Select Room</option>
                <option value="room1">Room 1</option>
                <option value="room2">Room 2</option>
                <option value="room3">Room 3</option>
            </select>
            
            <label for="name">Name:</label>        
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Time:</label>
            <input type="time" id="time" name="time" required>

            <label for="duration">Duration (hours):</label>
            <select name="duration" id="duration" required>
                <option value="" disabled selected>Select duration</option>
                <option value="1-hour">1</option>
                <option value="2-hours">2</option>
                <option value="3-hours">3</option>
            </select>

            <label for="attendees">Number of Attendees:</label>
            <input type="number" id="attendees" name="attendees" min="1" max="5">

            <label for="purpose">Purpose of Booking:</label>
            <textarea id="purpose" name="purpose" rows="4" cols="50"></textarea>

            <label for="terms">I agree to the terms and conditions:</label>
            <input type="checkbox" id="terms" name="terms" required>

            <button type="submit">Book Now</button>
        </form>
</main>
<footer>
    <p>&copy; 2026 Group Room Bookings. All rights reserved.</p>
</footer>
</body>
</html>
